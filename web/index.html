<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ALEPH – Oberflächen-Gerüst (Beispieldaten)</title>
<meta name="description" content="ALEPH erkennt außergewöhnliche Entwicklungen in globalen Daten und zeigt sie mit Evidenzstufe und Unsicherheit auf einer filterbaren Karte. Diese Ansicht zeigt ausschließlich Beispieldaten." />
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.19.0/dist/maplibre-gl.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340..600&family=Fraunces:ital,opsz,wght@1,9..144,400..600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="map" aria-label="Globus mit Beispiel-Anomalien"></div>

  <div class="vignette" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">ALEPH</span>
      <span class="brand-badge" title="Alle Anomalien, Orte und Zahlen auf dieser Seite sind erfunden und dienen nur dem Test der Oberfläche.">Beispieldaten</span>
    </div>

    <div class="search-wrap">
      <label class="sr-only" for="search-input">Ort, Anomalie oder Theorie suchen</label>
      <input id="search-input" type="text" autocomplete="off"
             placeholder="Ort, Anomalie oder Theorie suchen …" />
      <div id="search-results" class="search-results" hidden role="listbox"></div>
    </div>

    <button id="filter-toggle" class="chip-btn" aria-expanded="false" aria-controls="filter-panel">
      Filter
    </button>
  </header>

  <aside id="filter-panel" class="filter-panel" aria-hidden="true">
    <div class="filter-head">
      <h2>Filter</h2>
      <button id="filter-close" class="icon-btn" aria-label="Filter schließen">✕</button>
    </div>
    <p class="filter-note">Diese Ansicht zeigt 18 erfundene Beispiel-Anomalien, damit sich das Gerüst der Oberfläche testen lässt – keine echten Messungen.</p>

    <div class="filter-count"><span id="filter-count">18</span> von 18 Beispiel-Anomalien sichtbar</div>

    <section class="filter-group">
      <label for="f-region">Region</label>
      <select id="f-region">
        <option value="alle">Alle Regionen</option>
      </select>
    </section>

    <section class="filter-group">
      <label for="f-typ">Anomalie-Typ</label>
      <select id="f-typ">
        <option value="alle">Alle Typen</option>
      </select>
    </section>

    <section class="filter-group">
      <span class="group-label">Evidenzstufe</span>
      <div class="check-list" id="f-evidenz">
        <label class="check-row"><input type="checkbox" value="beobachtet" checked> beobachtet</label>
        <label class="check-row"><input type="checkbox" value="statistische Assoziation" checked> statistische Assoziation</label>
        <label class="check-row"><input type="checkbox" value="Modellprojektion" checked> Modellprojektion</label>
        <label class="check-row"><input type="checkbox" value="hypothetisches Szenario" checked> hypothetisches Szenario</label>
      </div>
    </section>

    <section class="filter-group">
      <span class="group-label">Mindeststärke</span>
      <div class="segmented" id="f-staerke" role="radiogroup" aria-label="Mindeststärke">
        <button type="button" class="seg-btn is-active" data-value="auffällig">auffällig</button>
        <button type="button" class="seg-btn" data-value="stark">stark</button>
        <button type="button" class="seg-btn" data-value="extrem">extrem</button>
      </div>
    </section>

    <section class="filter-group">
      <label class="check-row check-row--standalone">
        <input type="checkbox" id="f-fokus"> nur Fokusgebiete zeigen
      </label>
    </section>

    <button id="filter-reset" class="text-btn">Filter zurücksetzen</button>
  </aside>

  <section id="investigation" class="investigation" aria-hidden="true" aria-label="Untersuchungsansicht">
    <button id="investigation-close" class="icon-btn" aria-label="Untersuchungsansicht schließen">✕</button>
    <div id="investigation-content" class="investigation-content"></div>
  </section>

  <div id="theorie-panel" class="theorie-panel" aria-hidden="true">
    <button id="theorie-close" class="icon-btn" aria-label="Schließen">✕</button>
    <div id="theorie-content" class="theorie-content"></div>
  </div>

  <footer class="timeline-dock">
    <div class="timeline-top">
      <span class="timeline-label">Zeitraum</span>
      <span class="timeline-readout"><span id="time-readout-start">2013-01</span> – <span id="time-readout-end">2027-12</span></span>
    </div>
    <div class="range-dual">
      <div class="range-track"></div>
      <div id="range-fill" class="range-fill"></div>
      <input id="time-start" type="range" min="0" max="179" value="0" step="1" aria-label="Zeitraum, Beginn">
      <input id="time-end" type="range" min="0" max="179" value="179" step="1" aria-label="Zeitraum, Ende">
    </div>
  </footer>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="beispieldaten/orte.js"></script>
  <script src="beispieldaten/beispiel_theorien.js"></script>
  <script src="beispieldaten/beispiel_anomalien.js"></script>
  <script src="https://unpkg.com/maplibre-gl@5.19.0/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
