id: nachtlicht-stromausfall-katastrophe
titel: Große Stürme und andere Katastrophen lassen das Nachtlicht in besiedelten Gebieten sinken (Stromausfall), danach erholt es sich
disziplin: Fernerkundung / Katastrophenforschung (Ereignisstudien mit Nachtlicht)

