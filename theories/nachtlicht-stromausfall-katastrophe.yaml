modell: >
  Ereignisstudie mit Basislinie (ALEPH-Vereinfachung, angelehnt an Román et al. 2019 und Zhao et al. 2018; die genaue ALEPH-Form ist nicht aus einer Quelle übernommen).
  Symbole: i = Gitterzelle (0,25°), t = Monat, L_it = monatlicher Nachtlichtwert der Zelle (VNP46A3), t0 = Ereignismonat aus dem Katalog (GDACS/EM-DAT),
  B_i = Basislinie der Zelle = Median von L_i über dieselben Kalendermonate der Jahre vor dem Ereignis, ohne den Ereignismonat (so schreibt es auch ARCHITECTURE.md Abschnitt 6 vor).
  (1) Relativer Rückgang: dL_it = (L_it - B_i) / B_i. Ein Wert von -0,3 heißt: 30 Prozent weniger Licht als normal. Zellen mit B_i = 0 (dunkel, unter der Rauschschwelle) werden nicht bewertet.
  (2) Erholungsanteil laut Quelle (Román et al. 2019): %Recovery_i = NTL_i / NTL_0 (Licht zum Zeitpunkt i geteilt durch Licht vor dem Ereignis). Also gilt %Recovery = 1 + dL.
  (3) Kennzahl 'Netto-Tage ohne Strom' laut Quelle (Román et al. 2019): NDWE = Summe über alle Zeitabschnitte i von (1 - NTL_i/NTL_0) * D_i, mit D_i = Länge des Abschnitts in Tagen. Formel aus dem Volltext über ein Zusammenfassungswerkzeug gelesen, nicht im Original-PDF gegengeprüft.
  (4) Erholungszeit (ALEPH-Vereinfachung, nicht aus der Quelle): T_rec = Anzahl Monate von t0 bis zum ersten Monat, ab dem |dL_it| <= d bleibt. Das Band d wird vor der Prüfung im Kalibrierzeitraum (2013-2019) festgelegt und im Prüfergebnis genannt; hier wird bewusst kein Zahlenwert gesetzt.
  (5) Vergleich ohne Basislinie-Fehler: Die Basislinie enthält Jahreszeiten, aber kein Trendwachstum; in schnell wachsenden Zellen müsste der Trend getrennt geschätzt werden (Ausbaustufe 2 in ARCHITECTURE.md Abschnitt 9a).
  Prüfbare Aussage in ALEPH: Für Katalogereignisse mit großflächigem, länger andauerndem Ausfall (Sturm/Überschwemmung) ist dL_it in besiedelten Zellen des betroffenen Gebiets im Monat t0 oder t0+1 häufiger stark negativ als in Kontrollzellen ohne Ereignis, verglichen mit einem Permutationsmodell, das Kalendermonat und räumliche Nachbarschaft erhält (ARCHITECTURE.md Abschnitt 8, Prüfung Punkt 3).

ursache: {layer: ereigniskatalog, richtung: Ereignis, zusätzlich: "Sturm / Erdbeben / Überschwemmung / Angriff auf Infrastruktur; Referenz GDACS und EM-DAT"}
wirkung: {layer: nachtlicht, richtung: rückgang, zusätzlich: "in besiedelter Zelle; anschließend Erholung Richtung Basislinie"}

# Einbruch: Tage (laut Quelle Roman 2019: Rückgang unmittelbar nach dem Ereignis). Im Monatsraster liegt er im Ereignismonat oder im Folgemonat, daher [0, 1].
# Die Erholung dauert laut einer einzigen Fallstudie (Puerto Rico nach Maria, Beobachtungsfenster 195 Tage, etwa 6,5 Monate) Wochen bis Monate; siehe mechanismus.
# Eine allgemeine Erholungsdauer für alle Ereignistypen ist in den geprüften Quellen nicht belegt und wird hier nicht behauptet.
verzögerung_monate: [0, 1]

geltungsbereich: >
  Hell beleuchtete, dicht besiedelte Zellen mit stabilem Grundlicht (nicht polar, nicht dünn besiedelt, Basislinie deutlich über der Rauschschwelle von 0,5 nW).
  Am besten gestützt für Hurrikane bzw. Zyklone (Zhang et al. 2023; Román et al. 2019). Für Erdbeben und Tornados ist die Methode in der Literatur nicht konsistent bestätigt.
  Im Monatsraster (VNP46A3) nur für Ausfälle, die länger als etwa zwei Wochen dauern (ALEPH-Überlegung, siehe fallstricke); kurze Ausfälle brauchen tägliche Daten (VNP46A2, Fokusgebiet).

mechanismus: >
  Ein Sturm, Beben, eine Überflutung oder ein Angriff beschädigt Stromnetz oder Straßenbeleuchtung. Ohne Strom fällt die Außenbeleuchtung aus, und der Satellit misst nachts weniger Licht.
  Laut Román et al. (2019) lag der Lichtrückgang auf Puerto Rico unmittelbar nach Hurrikan Maria (2017) insgesamt bei etwa 80 Prozent (aus dem Volltext über ein Zusammenfassungswerkzeug gelesen, nicht im Original-PDF gegengeprüft). Die Erholung wurde über 195 Tage (20.09.2017 bis 20.03.2018) verfolgt; ländliche Gemeinden hatten laut Quelle im Mittel 131 'Netto-Tage ohne Strom', städtische 115 (gleicher Vorbehalt). Wichtig: Das ist eine Fallstudie, keine allgemeine Erholungsdauer.
  Die Studien nutzen tägliche Black-Marble-Daten (Román 2019: Zusammenfassung über 4 Tage; Zhao 2018: Vergleich des Monats vor mit den 10 Tagen nach dem Ereignis). Unser Hauptlayer ist monatlich; siehe fallstricke.
  Forschungsstand: Die Grundidee ist etabliert und wird von NASA-nahen Gruppen verwendet, aber nicht unumstritten. Zhang et al. (2023) finden das Verfahren robust für Hurrikane, aber uneinheitlich und unzureichend für Erdbeben und Tornados, und nur schwache Übereinstimmung zwischen Lichtrückgang und dem Grad des Schadens. Skoufias et al. (2021) finden für fünf südostasiatische Länder mit monatlichen VIIRS-Daten kaum belastbare Effekte (nach Angabe der Arbeitsfassung wegen Rauschen und wenig wolkenfreier Tage in den Tropen); nur der Taifun Haiyan zeigte klare Effekte. Zhao et al. (2018) nennen Wolken als größte Einschränkung und weitere Einflüsse wie Rettungseinsätze, Verkehr und die sozioökonomische Lage.

bedingungen: >
  Stärker sichtbar bei großflächigem, langem Ausfall, hoher Ausgangshelligkeit und wenig Wolken in der Zeit nach dem Ereignis.
  Schwächer oder unsichtbar bei kurzem Ausfall, bei Ausfall nur tagsüber oder wechselnden Abschaltungen (Zusammenfassung Román 2019: Verfahren kann Teil-Ausfälle unterschätzen), bei Ereignissen ohne Stromausfall (z. B. viele Erdbeben) und in dünn besiedelten Zellen.
  Straßenbeleuchtung wird laut Román et al. (2019) oft später wieder eingeschaltet als die wichtige Energieinfrastruktur; das Nachtlicht erholt sich also eher später als der Strom für Krankenhäuser (Zeitverzerrung in der Quelle genannt).
  Bei Angriffen auf Infrastruktur (Kriegsgebiete) ist der Zeitverlauf oft wiederholt (Schaden, Reparatur, neuer Schaden); die einfache Erholungszeit ist dann nicht gut definiert (ALEPH-Überlegung).

gegenpositionen:
  - "Skoufias, Strobl & Tveit (2021, Geomatics, Natural Hazards and Risk; Verweis in quellen): Mit monatlichen VIIRS-Nachtlichtdaten fanden sie für Erdbeben, Überschwemmungen und Taifune in fünf südostasiatischen Ländern kaum belastbare Effekte; nur Taifun Haiyan (Philippinen) zeigte klare Wirkung. Angegebene Gründe (nach der Weltbank-Arbeitsfassung): Rauschen in den VIIRS-Daten und in den Tropen nur wenige wolkenfreie Tage pro Monat. Das betrifft direkt die Monatsauflösung, mit der ALEPH arbeitet."
  - "Zhang et al. (2023, Remote Sensing; Verweis in quellen): Das relative Nachtlicht-Änderungsmaß ist robust für Hurrikanschäden, aber für Erdbeben und Tornados uneinheitlich und unzureichend; die Korrelation zwischen Lichtrückgang und Schadensgrad ist niedrig. Nachtlicht ist demnach für 'Wo ist der Strom weg' brauchbar, aber nicht zum Messen von Schäden."
  - "Zhao et al. (2018; Verweis in quellen): Wolkenbedeckung ist eine wesentliche Einschränkung; Rettungseinsätze, Verkehr und sozioökonomische Verhältnisse beeinflussen das Ergebnis."
  - "Román et al. (2019; Verweis in quellen) selbst: Das Verfahren ergänzt Angaben der Versorger, es ersetzt sie nicht; es erfasst vor allem Außenbeleuchtung, nicht den Stromverbrauch von Haushalten."

fallstricke:
  - "ZENTRAL, Zeitauflösung: Die Ereignisstudien (Román 2019; Zhao 2018) nutzen tägliches Black Marble (VNP46A2, bei Román 2019 zu 4-Tage-Zeiträumen zusammengefasst). ALEPHs Hauptlayer ist VNP46A3 (monatlich, 0,25°). Ein Ausfall von Stunden bis wenigen Tagen verschwindet im Monatswert. Rechenbeispiel (ALEPH-Überlegung, nicht aus einer Quelle): Fällt das Licht 3 Tage lang ganz aus und geht der Monat mit 30 gleich gewichteten gültigen Nächten in den Mittelwert ein, sinkt der Monatsmittelwert nur um etwa 10 Prozent; das liegt oft im normalen Schwankungsbereich. Zusätzlich gehen nur wolkenfreie Nächte in das Monatsprodukt ein (Anbieter, docs/sources/vnp46a3.md); nach einem Sturm ist der Himmel oft bedeckt, sodass Ausfallnächte womöglich gar nicht in den Mittelwert kommen (ALEPH-Überlegung). Dazu kommt laut Anbieter die Ausreißerentfernung nach Tukey vor der Mittelung: Wenige dunkle Nächte könnten als Ausreißer entfernt werden (ALEPH-Überlegung, nicht getestet). Folge: Im Monatsraster sind nur lange Ausfälle prüfbar; die Theorie ist mit VNP46A3 allein nur eingeschränkt prüfbar."
  - "Auffüllung: Beim Monatsprodukt gibt es aufgefüllte Pixel (Quality 2, 'gap filled based on historical data', Anbieter). Ein Pixel, das aus früheren Werten gefüllt wurde, zeigt den Ausfall nicht. Nach Messung des Auftraggebers (docs/sources/vnp46a3.md) schwankt der Anteil stark: in einer Kachel 16 aufgefüllte Pixel, in einer anderen 1 784 479 (Ergebnis von zwei einzelnen Kacheln, nicht verallgemeinerbar). Vor jeder Prüfung sind _Num (Zahl der Nächte) und Anteil aufgefüllter Pixel je Zelle mitzuführen; Zellen mit hohem Auffüllanteil im Ereignismonat dürfen nicht als 'kein Rückgang' gewertet werden."
  - "Nachtlicht misst Beleuchtung, nicht Strom: Straßenbeleuchtung kommt laut Román et al. (2019) oft später zurück als die wichtige Energieinfrastruktur; Teilausfälle und wechselnde Abschaltungen sind schwer zu sehen. Notstromaggregate, Feuer und Hilfseinsätze können Licht erzeugen (Zhao 2018 nennt Rettungseinsätze und Verkehr als Einflussgrößen)."
  - "Nicht unterscheidbar: Stromausfall oder Bevölkerungsflucht/Evakuierung. Beide senken das Licht. Ein Rückgang nach einem Sturm kann auch von Abwanderung, Evakuierung, geschlossenen Betrieben oder Ausgangssperren kommen. Aus dem Nachtlicht allein ist das nicht zu trennen (ALEPH-Überlegung; in den gelesenen Kurzfassungen nicht ausdrücklich behandelt). Abhilfe nur mit Zusatzdaten (Bevölkerungsraster, IDMC/UNHCR, Netzbetreiberdaten)."
  - "Schäden nicht quantifizierbar: Zhang et al. (2023) finden niedrige Korrelation zwischen Lichtrückgang und Schadensgrad. ALEPH darf aus Nachtlicht 'vermutlicher Stromausfall' ableiten, nicht 'Schaden in Höhe von ...'. Typ-Sicherheit bleibt 'abgeleitet' (ARCHITECTURE.md Abschnitt 7)."
  - "Störungen im Signal: Wolken, Mondlicht, Schnee, Blickwinkel, Polarlicht. Das Produkt korrigiert einen Teil davon (Anbieter, docs/sources/vnp46a3.md), aber die nächtliche Wolkenmaske ist laut User Guide schwierig; Rest-Rauschen bleibt. Werte unter 0,5 nW werden auf 0 gesetzt: in dunklen Zellen sind Rückgänge nicht messbar. Schnee im Winter (z. B. Wintersturm) ist mit Schneefrei- und Schnee-Komposit nicht direkt vergleichbar."
  - "Nur ein Satellit: VNP46A3 liegt für 2013 bis 2025 nur von Suomi NPP vor (Auslieferung endet laut NASA am 1. November 2026). Die Überflugzeit ist eine feste Nachtzeit (etwa 01:30 Ortszeit laut einer Drittquelle, nicht geprüft); Ausfälle zu anderen Uhrzeiten werden nicht gesehen."
  - "Auswahlfehler des Katalogs: GDACS und EM-DAT nehmen bevorzugt Ereignisse auf, die Menschen betreffen; kleine Ereignisse in dünn besiedelten Gebieten fehlen. Katalog-Ereignisse und Nachtlicht-Anomalien sind daher nicht völlig unabhängig, denn beide hängen von der Besiedlung ab (ALEPH-Überlegung). Kontrollzellen müssen ähnlich besiedelt und hell sein."
  - "Der Fall Puerto Rico / Maria ist der Ursprungsfall der Theorie. Er darf als Beispiel und Plausibilitätstest dienen, nicht als unabhängiger Beleg (Test auf Trainingsfall). Die Prüfung nach ARCHITECTURE.md Abschnitt 8 verlangt getrennte Zeiträume und Ereignisse."
  - "Zirkularität bei der Benennung: Die ALEPH-Regel 'Anomalie: Stromausfall' (starker, plötzlicher Nachtlicht-Rückgang in besiedeltem Gebiet, anomaly_types.yaml) verwendet dasselbe Signal wie diese Theorie. Die Theorie darf nicht an Anomalien geprüft werden, die durch genau diese Regel gefunden wurden, sonst ist der Test zirkulär. Geprüft wird an einer unabhängigen Ereignisliste (Katalog)."
  - "Literaturlage: Die Zahlen zu Puerto Rico stammen aus einer Fallstudie. Aus den geprüften Kurzfassungen ergibt sich keine allgemeine Erholungsdauer. Nicht bestätigt (nur Sekundärangabe): dass Wang et al. (2018) die Hurrikane Sandy und Maria untersuchen."

datenbedarf:
  - {layer: nachtlicht_monatlich_vnp46a3, rolle: wirkung, status: in Arbeit, anmerkung: "Großer Lauf läuft, ein Testmonat vorhanden; nur Suomi-NPP, 2013-2025, 0,25°, monatlich. Ein großer Teil der 'gültigen' Pixel ist aufgefüllt (Qualität siehe docs/sources/vnp46a3.md), _Num und Auffüllanteil müssen je Zelle mitgeführt werden. Reicht nur für lange Ausfälle."}
  - {layer: nachtlicht_taeglich_vnp46a2, rolle: wirkung, status: geplant, anmerkung: "Im Fokusgebiet-Konzept (ARCHITECTURE.md Abschnitt 4a) vorgesehen, noch nicht gebaut, kein Steckbrief. Für die Theorie eigentlich nötig (Ereignisstudien nutzen tägliche Daten). Suomi-NPP-Auslieferung endet laut NASA am 2026-11-01; daher zeitnah laden, falls gewünscht (Datum kann sich laut NASA ändern)."}
  - {layer: ereigniskatalog_gdacs_emdat, rolle: ursache, status: geplant, anmerkung: "GDACS ist Referenzkatalog des Blindtests (Entscheidung E5), EM-DAT als zweiter Katalog (Abschnitt 5, Zugang noch einzurichten). Noch nichts geladen, kein Steckbrief. Liefert Ort, Datum, Ereignistyp als Ursache."}
  - {layer: bevoelkerung_ghsl_worldpop, rolle: kontrolle, status: geplant, anmerkung: "Abschnitt 5, ohne Steckbrief. Zum Auswählen besiedelter Zellen und als Kontrolle; trennt Evakuierung/Abwanderung aber nicht vom Stromausfall."}
  - {layer: idmc_unhcr_vertreibung, rolle: kontrolle, status: geplant, anmerkung: "Abschnitt 5, ohne Steckbrief. Kann helfen, Abwanderung als Alternativerklärung zu prüfen; zeitlich und räumlich meist grob."}
  - {layer: ausfallzeiten_netzbetreiber, rolle: validierung, status: fehlt, anmerkung: "Ausfall- und Wiederherstellungsdaten der Netzbetreiber sind nirgends geplant. Ohne sie ist die Aussage 'Nachtlichtrückgang = Stromausfall' nicht direkt gegen die Wirklichkeit prüfbar, nur gegen Ereigniskataloge."}
  - {layer: wolken_mondlicht_schnee_qualitaet, rolle: kontrolle, status: in Arbeit, anmerkung: "Teil von VNP46A3 (Felder _Num, _Quality, Schnee-Trennung); keine eigene Quelle nötig."}

