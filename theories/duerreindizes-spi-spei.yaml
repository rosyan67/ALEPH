# Theorie-Eintrag ALEPH, Format nach ARCHITECTURE.md Abschnitt 8.
# Stand der Literaturprüfung: 2026-09-23. Formuliert VOR jeder ALEPH-Auswertung; keine ALEPH-Ergebnisse eingeflossen.
# ART DES EINTRAGS: Mess-/Indexeintrag. SPI und SPEI sind Rechenvorschriften (Maßstäbe), keine Kausaltheorie.
# Als prüfbare Hypothese steckt darin nur: "Ein Niederschlags-/Wasserbilanzdefizit über k Monate geht mit
# einem Vegetationsrückgang (NDVI) einher." Das wird in ALEPH geprüft, nicht der Index selbst.

id: duerreindizes-spi-spei
titel: >
  Dürreindizes SPI und SPEI: standardisierter Maßstab für Niederschlags- bzw. Wasserbilanzdefizite
  und ihr Zusammenhang mit Vegetationsrückgang
disziplin: Klimatologie / Hydrometeorologie (Dürre-Überwachung)

