      dort gelesen. ABWEICHUNG vom Auftrag: (1) Es sind fünf Autoren, nicht "Bettencourt & West".
      (2) Der Abstract nennt für Wohlstand/Innovation beta ungefähr 1,2 und für Infrastruktur beta ungefähr 0,8.
      Die im Auftrag genannten Werte 1,15 und 0,85 habe ich in dieser Quelle NICHT bestätigen können
      (sie stehen laut Sekundärquellen in späterer Literatur, das habe ich nicht am Original geprüft).
      Der Wert beta ungefähr 1 für individuelle Bedürfnisse steht nicht im Abstract; nicht bestätigt.
      Tabelle 1 mit den einzelnen Exponenten und Konfidenzintervallen war nicht lesbar
      (PNAS-Seite gesperrt, PMC nur mit Sicherheitsabfrage, PDF nur als Binärdatei);
