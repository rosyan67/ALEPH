id: urban-scaling-flaechenausdehnung
titel: Städtische Kennzahlen wachsen als Potenzgesetz der Einwohnerzahl (Urban Scaling); Stadtfläche wächst mit der Bevölkerung
disziplin: Stadtforschung / Komplexitätsforschung / Stadtgeographie (Fernerkundung)

# Eingangs-Hinweis zur Zuordnung (Korrektur gegenüber der Auftragsformulierung):
# "Bettencourt & West 2007, PNAS" ist so nicht richtig. Die PNAS-Arbeit von 2007 hat fünf Autoren
# (Bettencourt, Lobo, Helbing, Kühnert, West). "Bettencourt & West" als Autorenpaar gehört zu
# "A unified theory of urban living", Nature 2010 (ein kurzer Beitrag, kein Datenaufsatz).
# Beide werden unten getrennt und richtig zitiert.

