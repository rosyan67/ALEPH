modell: >
  Prüfplan in drei Teilen; Teil A ist die Hauptaussage, Teil B und C sind ausdrücklich Zusatzfragen.

  Teil A (Querschnitt, Hauptprüfung): log L_c = log L0 + beta * log N_c + e_c. Symbole: c = Stadt;
  N_c = Einwohner der Stadt c in einem Bezugsjahr (GHSL, Epoche 2015 bzw. 2020); L_c = Nachtlichtsumme der Stadt
  im selben Jahr (Summe der Strahldichte über die Stadtfläche, aus den Monatswerten des Jahres gemittelt);
  L0 = Normierungskonstante; beta = Skalenexponent (beta = 1: Licht wächst proportional zur Bevölkerung, beta > 1:
  überproportional, beta < 1: unterproportional); e_c = Streuung der einzelnen Stadt. Die Literatur (Bettencourt
  et al. 2007) beschreibt das Potenzgesetz Y = Y0 * N^beta für viele Stadtkennzahlen, mit beta ungefähr 1,2 für
  Wohlstand und Innovation (überproportional), ungefähr 0,8 für Infrastruktur (unterproportional). Die Werte 1,15
  und 0,85 und beta ungefähr 1 für individuelle Bedürfnisse sind vom Nutzer genannt, nicht bestätigt.
  Die Gleichung selbst wurde in der Literatur für Kennzahlen wie Patente, Einkommen und Kabellängen gezeigt,
  NICHT für Nachtlichtsummen; dass Licht als Ersatzgröße für Wirtschaftsleistung solches Skalieren zeigt,
  ist eine Annahme von ALEPH, keine Aussage der Quellen. Schätzung: Kleinste Quadrate auf den Logarithmen
  (Standardverfahren), Konfidenzintervall für beta, ZUSÄTZLICH ein Gegenprüfmodell mit ausdrücklich modellierter
  Streuung nach Leitão et al. (2016), weil das Ergebnis von der Streuungsannahme abhängen kann. Das Ergebnis
  wird für mindestens drei Stadtabgrenzungen (Variante 1: GHSL-Urban-Centre; Variante 2: alle Zellen mit
  Einwohnerdichte über einer Schwelle; Variante 3: feste Kreise um das Stadtzentrum) getrennt berichtet, weil
  Arcaute et al. (2015) zeigen, dass der Exponent von der Abgrenzung abhängt.

  Teil B (beleuchtete Fläche, Zusatzfrage): log A_c = log A0 + alpha * log N_c + e_c. A_c = beleuchtete
  Fläche der Stadt c (Fläche der Bildpunkte mit Strahldichte über der Rauschschwelle 0,5 nW/(cm2 sr), unter der
  VNP46A3 die Werte auf 0 setzt); alpha = Flächen-Exponent. Aus den verifizierten Quellen lässt sich der Wert von
  alpha nicht ablesen (Seto et al. beschreiben Zuwachsraten, keinen Querschnitts-Exponenten; die Arbeit von
  Xu et al., ein nicht geprüfter Vorabdruck, nennt im Querschnitt sublineare Skalierung der bebauten Fläche).
  Es wird deshalb keine Zahl und nur eine schwache Richtungserwartung festgelegt (siehe wirkung). Dieser Teil
  braucht die 500-m-Auflösung (nicht das 0,25-Grad-Raster); siehe datenbedarf und fallstricke.

  Teil C (Zeitvergleich nach Seto et al., Zusatzfrage): Delta ln A_c = gamma * Delta ln N_c + e_c, mit
  Delta = Veränderung zwischen zwei Epochen (z. B. 2015 -> 2020, also 60 Monate; GHSL liefert 5-Jahres-Schritte).
  gamma >= 1 heißt: die Fläche wächst mindestens so schnell wie die Bevölkerung (Seto et al. 2011 finden das
  im Mittel für 1970-2000; anderer Zeitraum, andere Datenart, kein Nachtlicht). Wirtschaftskraft (BIP pro Kopf)
  gibt es nur auf Länderebene (Weltbank) und kann daher nur grob als Kontrolle je Land dienen.

  Aufteilung nach Abschnitt 8: Kalibrierung mit Epoche 2015, Test mit Epoche 2020 (GHS-POP 2025 ist eine
  Projektion und wird nicht als Testdatum verwendet). Zufallsvergleich: Städte-Bevölkerung wird über Städte
  vertauscht (Permutation), ggf. innerhalb von Länder-Gruppen, um Länderunterschiede zu erhalten.

ursache: {layer: bevoelkerung, richtung: Größe der Stadt (Einwohnerzahl N), zusätzlich: "höhere Einwohnerzahl gleich mehr Nachtlicht und mehr beleuchtete Fläche"}
wirkung: {layer: nachtlicht, richtung: "Anstieg mit der Stadtgröße, erwartet überproportional (beta > 1) für die Lichtsumme; Richtung für die beleuchtete Fläche nicht festgelegt, schwach sublinear im Querschnitt (alpha < 1) vermutet", zusätzlich: "Nachtlicht dient als Ersatzgröße für wirtschaftliche Aktivität bzw. städtische Ausdehnung"}
verzögerung_monate: [0, 0]
# Erklärung zur Verzögerung: Teil A ist ein Querschnitt (alle Städte im selben Jahr), es gibt keine Verzögerung.
# Das Bevölkerungsraster liegt nur in 5-Jahres-Epochen vor (2015, 2020; 2025 ist Projektion); Nachtlicht wird
# auf das Epochenjahr gemittelt. Der Zeitvergleich (Teil C) betrachtet Änderungen über 60 Monate (eine
# Epochenstufe) und ist damit eine Langfrist-Aussage über Jahre, keine Monats-Aussage. Für ALEPH's monatliche
# Anomalieerkennung ergibt sich aus dieser Theorie keine Verzögerung.
geltungsbereich: >
  Städte weltweit, die groß genug sind, um im 0,25-Grad-Raster als eigene Gruppe von Zellen aufgelöst zu werden
  (ungefähr ab mehreren Zellen Fläche; die genaue Mindestgröße wird vor der Prüfung festgelegt und die Zahl der
  verbleibenden Städte offen berichtet). Die Literatur zeigt Skalengesetze vor allem für Städte in einem
  gemeinsamen Land bzw. Städtesystem (USA, Europa, China u. a.); Exponenten können sich zwischen Ländern
  unterscheiden (nicht an den Quellen einzeln geprüft). Nicht gültig für einzelne Stadtviertel, für Zellen
  innerhalb einer Stadt und nicht für Monatsschwankungen.

mechanismus: >
  Nach Bettencourt et al. (2007) sind viele Eigenschaften von Städten Potenzgesetze der Einwohnerzahl: Größere
  Städte erzeugen pro Kopf mehr Wohlstand und Innovation (beta ungefähr 1,2, "zunehmende Erträge") und brauchen
  pro Kopf weniger Infrastruktur (beta ungefähr 0,8, "Skaleneffekte"). Bettencourt & West (2010) fassen das
  als "einheitliche Theorie" zusammen (Inhalt dort nicht gelesen). Für die Fläche beschreiben Seto et al. (2011)
  ein Muster in Beobachtungsdaten, keine Theorie: Städte dehnen sich im Mittel mindestens so schnell aus, wie
  ihre Bevölkerung wächst; der Einfluss der Wirtschaftskraft unterscheidet sich je Region.
  STREIT IN DER FACHWELT: Ob die Potenzgesetze allgemein gelten, ist umstritten. Arcaute et al. (2015) finden
  bei England und Wales, dass die Ergebnisse von der Stadtabgrenzung abhängen und die meisten Kennzahlen linear
  skalieren. Leitão et al. (2016) zeigen, dass die Schlussfolgerung beta ungleich 1 von der Annahme über die
  Streuung abhängt. Shalizi (2011, Vorabdruck) hält Potenzgesetz und andere Formen für nicht unterscheidbar und
  sieht die Wirkung großenteils als Effekt von Gesamtwerten statt Pro-Kopf-Werten. Xu et al. (Vorabdruck, nicht
  geprüft) sehen einen Gegensatz zwischen Querschnitt und Zeitverlauf bei der bebauten Fläche.
  VERKNÜPFUNG: Dieser Eintrag hängt mit "nachtlicht-wirtschaft" zusammen. Dort geht es um Nachtlicht als
  Ersatzgröße für Wirtschaft; hier um die Frage, wie Licht mit der Stadtgröße wächst. Ein Teil des Lichts ist
  Straßenbeleuchtung, also Infrastruktur, für die die Theorie unterproportionales Wachstum erwartet, ein anderer
  Teil Geschäfts- und Wirtschaftsaktivität, für die überproportionales erwartet wird. Das gemessene beta der
  Lichtsumme ist darum eine Mischung; weder beta < 1 noch beta > 1 lässt sich ohne Weiteres als Aussage über
  "die Wirtschaft" lesen (Fallstrick sublinear/superlinear, siehe dort).

bedingungen: >
  Stärker aussagekräftig, wenn (a) die Stadtgrenze fachlich begründet und in mehreren Varianten getestet wird,
  (b) die Stadtgrößen mehrere Größenordnungen abdecken (bei ALEPH wegen der Zellgröße wahrscheinlich nur eine
  bis zwei; nicht quantifiziert), (c) Städte innerhalb eines Landes bzw. Städtesystems verglichen werden, und
  (d) Lichtsumme nicht durch Sättigung, Überstrahlung oder Winkelabhängigkeit verzerrt ist. Die Theorie ist
  eine Aussage über den Durchschnitt vieler Städte, nicht über eine einzelne Stadt. ALEPH nutzt sie deshalb
  nicht, um einzelne Anomalien zu erklären, sondern als Prüfstein dafür, ob Nachtlicht Stadtgröße und
  Ausdehnung plausibel abbildet.

gegenpositionen:
  - "Arcaute et al. (2015, J. R. Soc. Interface): Bei tausenden Abgrenzungen englischer und walisischer Städte werden die erwarteten Skalengesetze nicht bestätigt; die meisten Kennzahlen skalieren linear; wo nicht, schwankt der Exponent stark mit der Abgrenzung (Quelle in quellen)."
  - "Leitão et al. (2016, R. Soc. Open Sci.): Ob beta ungleich 1 gilt, hängt von der Modellierung der Streuung und der Verteilung der Stadtgrößen ab; nicht in allen fünfzehn geprüften Datensätzen gestützt (Quelle in quellen)."
  - "Shalizi (2011, Vorabdruck): Für US-Daten sei ein Potenzgesetz nicht von anderen Formen unterscheidbar; Gesamtwerte statt Pro-Kopf-Werte erzeugen den Anschein von Skalieren (Quelle in quellen; nicht Peer-Review-geprüft belegt)."
  - "Puente-Ajovín et al. (2024, J. Regional Sci.): Der Zusammenhang zwischen Bevölkerung und Nachtlicht über Städte ist nichtlinear und uneinheitlich, und Nachtlicht-Verteilungen folgen keiner Pareto-Funktion; beides erschwert die Annahme eines einfachen, einheitlichen Exponenten für Licht (Quelle in quellen)."
  - "Xu et al. (Vorabdruck, nicht geprüft): Bebaute Fläche skaliert im Querschnitt sublinear, in einzelnen Städten über die Zeit aber superlinear; Querschnittsexponenten sagen das Wachstum einer Stadt nicht voraus (Quelle in quellen)."

fallstricke:
  - "Abgrenzung der Stadt (modifiable areal unit problem): Das Ergebnis hängt davon ab, wo die Stadtgrenze gezogen wird (Arcaute et al. 2015). Im ALEPH-Raster kommt hinzu, dass Stadtgrenzen nicht mit Gitterzellen zusammenfallen: Eine Zelle ist am Äquator ca. 28 km breit (ca. 770 km2 Fläche), in höheren Breiten schmaler. Viele Städte belegen weniger als eine Zelle, andere mehrere; Zellen mischen oft Nachbarstädte, Umland und Wasser. Ergebnisse sind daher nur für Stadtabgrenzungen über mehrere Zellen aussagekräftig, und jede Abgrenzung (z. B. GHSL-Urban-Centre) muss als Variante gemeldet werden."
  - "Zu wenige und zu ähnlich große Städte: Nur Städte, die mehrere Zellen füllen, lassen sich einzeln auflösen. Wie viele das sind und über welches Größenspektrum, ist nicht bekannt und wird erst beim Zählen offen berichtet. Ein schmales Größenspektrum macht den Exponenten sehr ungenau; Konfidenzintervalle müssen gezeigt werden, keine Einzelzahl."
  - "Beleuchtete Fläche ist im 0,25-Grad-Raster praktisch nicht messbar: Die Fläche einer Stadt käme nur in Vielfachen von etwa 770 km2 vor. Teil B braucht die 500-m-Kacheln der Rohdaten. Ob diese Rohkacheln aufbewahrt werden, ist nicht geprüft."
  - "Sättigung und Überstrahlung des Nachtlichts (Blooming): Helle Stadtkerne und beleuchtete Ränder können Licht in Nachbarpixel streuen und die Fläche aufblähen; das ist hier als bekannte Fehlerquelle genannt, aber für VNP46A3 nicht belegt. Belegt (Steckbrief) ist: VNP46A3 Version 2 speichert Fließkommawerte ohne die Sättigung von Version 1 bei 6553,5; der Anbieter warnt vor starker Winkelabhängigkeit gerade in dichten Stadtzentren; Werte unter 0,5 nW/(cm2 sr) werden auf 0 gesetzt, wodurch schwach beleuchtete Randgebiete abgeschnitten werden."
  - "Datenqualität von VNP46A3: Ein großer Teil der 'gültigen' Pixel ist aufgefüllt bzw. hat wenige Nächte (siehe docs/sources/vnp46a3.md). Für Jahressummen muss die Datenlage je Stadt und Monat mitgeführt und Städte mit dünner Datenlage (z. B. hohe Breiten im Sommer, Schnee im Winter) getrennt behandelt oder ausgeschlossen werden. Die Summen setzen aus dem gespeicherten Zellmittel und der Zahl gültiger Pixel zusammen; das ist eine Näherung und sollte gegen die 500-m-Daten geprüft werden."
  - "Summe gegen Mittelwert (extensive gegen intensive Größe): Die Lichtsumme einer Stadt und ihre Einwohnerzahl hängen schon durch die Stadtfläche zusammen; das kann Skalieren erzeugen, das nichts über 'Wirtschaft' aussagt (Shalizi 2011: Gesamtwerte statt Pro-Kopf-Werte). Es muss auch die Pro-Kopf- bzw. Dichte-Form berichtet werden."
  - "Sublinear gegen superlinear (Verbindung zu nachtlicht-wirtschaft): Licht mischt Infrastruktur (Straßenbeleuchtung, erwartet beta < 1) und wirtschaftliche Aktivität (erwartet beta > 1). Ein gemessenes beta kann deshalb nicht einfach als Hinweis für oder gegen Wirtschaft-Skalieren gelesen werden. Für die Prüfung von nachtlicht-wirtschaft dürfen die hier gewonnenen Exponenten nicht zur nachträglichen Deutung herangezogen werden."
  - "Querschnitt ist nicht Zeitverlauf: Ein Exponent aus vielen Städten in einem Jahr sagt nichts sicher über das Wachstum einer einzelnen Stadt (Xu et al., Vorabdruck). Seto et al. (2011) betrachten Zuwachsraten 1970-2000, andere Zeit, andere Daten (Fernerkundungsstudien, kein Nachtlicht); ihre Zahlen sind für 2013-2025 nicht übertragbar."
  - "Unterschiede zwischen Ländern: Exponenten und Stadtdefinitionen können sich zwischen Ländern unterscheiden; ein weltweiter Sammelwert kann Länderunterschiede und Stromversorgungsniveau (Elektrifizierung, Lichtmuster) vermischen. Ergebnisse nach Land bzw. Einkommensgruppe getrennt zeigen, mit Kontrolle je Land. Nicht an den Quellen im Einzelnen geprüft."
  - "Schätzfehler bei logarithmischer Schätzung: Kleinste Quadrate auf Logarithmen setzt eine bestimmte Streuung voraus; verletzt man das, sind beta und Konfidenzintervall verzerrt. Kleine Städte mit Lichtsumme null (Rauschschwelle) lassen sich nicht logarithmieren und fallen heraus (verzerrte Auswahl). Leitão et al. (2016) zeigen, dass die Streuungsannahme das Ergebnis ändern kann; deshalb zwei Schätzverfahren."
  - "Bevölkerungsraster ist modelliert, nicht gemessen: GHS-POP verteilt Volkszählungswerte mit Hilfe der Bebauung auf ein Gitter; 2025 und 2030 sind Projektionen. Fehler im Raster (und Fehler durch die Verteilungsregel) gehen in N_c ein. Ob Nachtlicht selbst ein Eingang der GHSL-Bevölkerungsverteilung ist (dann Zirkularität), wurde nicht geprüft."
  - "Nicht für ALEPH-Anomalieerkennung geeignet: Dieser Eintrag prüft ein statisches Größenverhältnis über Jahre; er liefert keine Verknüpfung zwischen Monatsereignissen. Ereignisse wie 'Stadtwachstum' (anomaly_types.yaml) dürfen daraus nicht als bestätigt abgeleitet werden."

