modell: >
  Vereinfachte Darstellung zur Prüfung, NICHT aus einer Quelle übernommen (die genaue Kurvenform in Pausas & Ribeiro 2013 wurde nicht am Volltext geprüft).
  Es gibt zwei Ebenen.
  (A) Räumlich, über viele Zellen, Langzeitmittel:  B_i = a + b * M_i + c * M_i^2 + e_i  mit c < 0.
  B_i = mittlere jährliche Feueraktivität der Zelle i (Zahl aktiver Feuer-Detektionen je 0,25°-Zelle, geplant aus FIRMS).
  M_i = langjähriges Mittel von Niederschlag (IMERG) bzw. Vegetationsproduktivität (mittlerer NDVI, MOD13C2) der Zelle i.
  a, b, c = anzupassende Zahlen. c < 0 heißt glockenförmig: Das Maximum liegt bei M* = -b / (2c) und muss innerhalb des beobachteten Wertebereichs liegen.
  e_i = Rest (alles, was das Modell nicht erklärt).
  (B) Zeitlich, innerhalb einer Zelle:  B_it = f(K_it) * g(T_it).
  K_it = verfügbarer Brennstoff, wachsend mit dem Niederschlag der Vorjahre (etwa P_i,t-L mit L = 14 bis 25 Monate); f steigt und sättigt.
  T_it = Trockenheit des Brennstoffs im Monat t (etwa Niederschlagsdefizit im selben Monat oder in der Saison, später ERA5-Bodenfeuchte); g steigt mit der Trockenheit.
  In Anomalieform (Abweichung vom Jahresgang, wie ARCHITECTURE.md Abschnitt 6):  dB_it = beta_A(M_i) * dP_i,t-L + beta_B(M_i) * dP_i,t + e_it.
  dB = Feuer-Anomalie, dP = Niederschlags-Anomalie, beta_A = Wirkung des Niederschlags der Vorjahre (Brennstoffaufbau), beta_B = Wirkung des Niederschlags im selben Zeitraum (Trockenheit).
  Erwartete Vorzeichen: beta_A > 0 in trockenen Zellen (Brennstoff knapp), beta_B < 0 in feuchten Zellen (Brennstoff reichlich, aber oft zu nass).
  Die Vorzeichen hängen damit von M_i ab. Das ist der Kern der Theorie.

ursache:
  layer: niederschlag
  richtung: "nicht monoton; Vorzeichen hängt vom Ausgangszustand der Zelle ab (trockene Zellen: mehr Niederschlag der Vorjahre -> mehr Feuer; feuchte Zellen: weniger Niederschlag im selben Zeitraum -> mehr Feuer)"
  zusätzlich: [vegetation (NDVI als Produktivität/Brennstoff), klima (ERA5 Bodenfeuchte/Trockenheit, geplant)]

wirkung:
  layer: brände
  richtung: "glockenförmig über den Feuchte-/Produktivitätsgradienten (Maximum im mittleren Bereich, z. B. Savannen); zeitlich: Anstieg oder Rückgang je nach Ausgangszustand"
  zusätzlich: Feueraktivität (aktive Feuer-Detektionen je Zelle und Monat, FIRMS, geplant)

# Zwei Zweige. Zweig B (feuchte Zellen, Trockenheit): gleichzeitig, also 0 Monate (Quelle: Abatzoglou et al. 2018, Trockenheit des Brennstoffs zählt vor allem in feuchteren Regionen).
# Zweig A (trockene Zellen, Brennstoffaufbau): 14 bis 25 Monate nach dem Niederschlag (Abatzoglou et al. 2018: "14-25 Monate vor der Feuersaison", bereits in Monaten angegeben;
# Archibald et al. 2009: Niederschlag der vorangegangenen 2 Jahre, das sind ca. 24 Monate, Jahresangabe in Monate umgerechnet).
# Die 14 bis 25 Monate gelten in der Quelle für nicht bewaldete Flächen in halbtrockenen Regionen, nicht für alle Regionen.
verzögerung_monate: [0, 25]

geltungsbereich: >
  Für die glockenförmige Langzeitbeziehung (A): global auf Ebene von Ökoregionen gezeigt (Pausas & Ribeiro 2013); ob sie auf 0,25°-Zellen gleich aussieht, ist nicht belegt.
  Für die zeitliche Umkehr (B): Halbtrockene Regionen mit nicht bewaldeten Flächen (Savannen, Grasland, Buschland) für den Brennstoffaufbau; mesische (mittelfeuchte) und Waldregionen
  für die Trockenheitswirkung (Abatzoglou et al. 2018). Die Beziehungen sind in der Quelle nicht in allen Regionen gleich stark.
  Menschlich geprägte Gebiete gelten als Ausnahme: Ausbau und Intensivierung der Landwirtschaft haben laut Andela et al. (2017) die globale Brandfläche gesenkt, am stärksten in Savannen;
  Abatzoglou et al. (2018) fanden eine schwächere Klima-Feuer-Beziehung in stark vom Menschen geprägten Waldgebieten. Brandrodung und aktive Feuerunterdrückung als Einzelmechanismen
  wurden in diesem Eintrag nicht an einer eigenen Quelle belegt und werden deshalb nicht als belegte Ausnahme geführt.
  Nicht anwendbar: Eis- und Kältewüsten sowie Gebiete ohne Vegetation (Feuer dort kaum möglich, ohne eigene Quelle; als Annahme für die Prüfung, dass sie aus der Analyse ausgeschlossen werden).

mechanismus: >
  Damit ein Feuer brennt, müssen genug Brennstoff da sein und der Brennstoff muss trocken genug sein (Zusammenfassung der Literatur, u. a. Krawchuk & Moritz 2011; Pausas & Ribeiro 2013).
  Entlang eines Feuchte-/Produktivitätsgradienten wird zuerst der Brennstoff knapp (sehr trockene Regionen: "zu wenig zum Brennen"), am anderen Ende die Trockenheit (sehr feuchte, dichte Wälder:
  "zu nass zum Brennen"). Dazwischen (z. B. Savannen) liegt das Maximum. Die Richtung des Zusammenhangs ist deshalb NICHT monoton: In trockenen Regionen erhöht ein nasses Jahr
  über den Brennstoffaufbau später die Feuergefahr, in feuchten Regionen senkt Niederschlag im selben Zeitraum die Feuergefahr. Je nach Ausgangszustand einer Region kehrt sich die Richtung also um.
  Forschungsstand: Die glockenförmige Beziehung ist ein verbreitetes, oft zitiertes Muster, aber umstritten in Deutung und Nutzen. Bistinas et al. (2014) sehen glockenförmige Kurven zu Niederschlag und
  Temperatur als Nebenfolge von Korrelationen zwischen Einflussgrößen (etwa hohe Produktivität bei hohem Niederschlag), nicht als eigenen Mechanismus. Bowman et al. (2014) verweisen auf Rückkopplungen zwischen Feuer,
  Klima und Vegetation, die solche Muster für Vorhersagen unsicher machen. Kahiu & Hanan (2018) beschreiben für Afrika südlich der Sahara eine sättigende statt glockenförmige Abhängigkeit vom Brennstoff.
  Andela et al. (2017) zeigen, dass menschliche Landnutzung das natürliche Muster verändert. Ein glockenförmiges Muster allein bestätigt den Mechanismus deshalb nicht.
  Zu Bowman et al. (2009), Science ("Fire in the Earth System"): geprüft, aber die Aussage zur glockenförmigen Beziehung konnte am Text nicht bestätigt werden; die Arbeit wird hier nicht als Beleg genutzt.

bedingungen: >
  Stärker sichtbar, wenn menschlicher Einfluss gering ist (wenig Landwirtschaft, wenig Feuermanagement) und wenn nach Biomen getrennt wird. Der Brennstoffaufbau-Zweig gilt für halbtrockene, nicht bewaldete Regionen,
  der Trockenheits-Zweig eher für mesische und bewaldete Regionen (Abatzoglou et al. 2018). Die Lage des Maximums und die Stärke der Kurve sind nicht als feste Zahlen aus den Quellen übernommen.
  Grenzen zwischen "trocken" und "feucht" (z. B. Terzile des Langzeit-Niederschlags) werden von ALEPH vor der Prüfung festgelegt und sind nicht aus den Quellen abgeleitet.

gegenpositionen:
  - "Bistinas et al. (2014, Biogeosciences): Glockenförmige Beziehungen zu Niederschlag und Temperatur sind Nebenfolgen korrelierter Einflussgrößen; Brandfläche steigt mit Nettoprimärproduktion und Zahl der Trockentage und sinkt mit Bodenfeuchte (Quelle in quellen)."
  - "Bowman et al. (2014, Global Ecology and Biogeography): Feedbacks zwischen Feuer, Klima und Vegetation können das Muster für Vorhersagen unbrauchbar machen; dynamische Modelle nötig (Quelle in quellen)."
  - "Kahiu & Hanan (2018, Global Ecology and Biogeography): In afrikanischen Savannen steigt die Feueraktivität sättigend mit der Produktion krautiger Vegetation (Brennstoff, Trocknung, Verbundenheit), nicht glockenförmig (Quelle in quellen; nur Suchtreffer-Auszug gesehen)."
  - "Andela et al. (2017, Science): Der Rückgang der globalen Brandfläche bleibt nach Bereinigung um Niederschlagsschwankungen bestehen und wird vor allem mit Landwirtschaft in Verbindung gebracht, am stärksten in Savannen, also gerade in der Region des Maximums; menschliche Kontrolle überlagert damit das natürliche Muster (Quelle in quellen)."
  - "Archibald et al. (2009, Global Change Biology): Im südlichen Afrika begrenzt nicht die Zündung, sondern Brennstoffmenge und Feuchte die Brandfläche; menschliche Einflüsse wirken nur unter bestimmten Klimabedingungen (Quelle in quellen; stützt die Theorie teilweise, schränkt sie aber regional ein)."

fallstricke:
  - "Menschliche Zündung und Feuermanagement verändern das natürliche Muster: Landwirtschaft senkt die Brandfläche, besonders in Savannen (Andela et al. 2017); in stark vom Menschen geprägten Waldgebieten ist die Klima-Feuer-Beziehung schwächer (Abatzoglou et al. 2018). Ohne Kontrolle für Bevölkerung und Landnutzung ist das Ergebnis schwer zu deuten."
  - "Umkehrung der Richtung: Ein einfacher Test auf 'mehr Regen gleich mehr Feuer' oder 'mehr Regen gleich weniger Feuer' über alle Zellen zusammen mittelt beide Zweige weg und kann ein Ergebnis nahe null zeigen, obwohl beide Zweige stimmen. Die Prüfung muss nach dem Ausgangszustand der Zelle getrennt oder mit Wechselwirkung erfolgen."
  - "Glockenform allein ist kein Beleg für den Mechanismus: Sie kann laut Bistinas et al. (2014) aus Korrelationen zwischen Einflussgrößen entstehen. Nur die Vorzeichenwechsel und die Verzögerung (Zweig A und B) sind ein schärferer Test."
  - "Rückwärts-Ursache bei NDVI: Feuer senkt die Vegetation im selben Monat, sodass NDVI und Feuer im selben Monat nicht als Ursache-Wirkung gelesen werden dürfen. NDVI muss verzögert (Vorjahre) als Brennstoffmaß genutzt werden. (Eigene methodische Überlegung, nicht an einer Quelle belegt.)"
  - "NDVI sättigt bei dichter Vegetation (Huete et al. 2002): Am feuchten Ende der Kurve unterscheidet NDVI Produktivitätsstufen schlecht. EVI (im MOD13C2-Produkt vorhanden) ist dort empfindlicher."
  - "Kleinfeuer: Viele kleine Feuer liegen unter der Nachweisgrenze globaler Brandflächenprodukte (Randerson et al. 2012, +35 % Brandfläche mit Kleinfeuern); das betrifft Brandflächen, nicht direkt aktive Feuer aus FIRMS. Wie gut FIRMS Kleinfeuer erfasst, ist in diesem Eintrag nicht belegt."
  - "Aktive Feuer und Brandfläche sind zwei verschiedene Messgrößen (Zahl der Detektionen zum Überflug gegenüber verbrannter Fläche). ALEPH plant nur aktive Feuer (FIRMS); die Theorie und die Quellen arbeiten meist mit Brandfläche. Ergebnisse sind nicht ohne Weiteres übertragbar. Wolkenabdeckung, Überflugzeit und Sensorunterschiede MODIS/VIIRS beeinflussen die Detektion; dazu gibt es in diesem Eintrag keine geprüfte Quelle, das gehört in den noch fehlenden FIRMS-Steckbrief."
  - "Räumliche Skala: Die glockenförmige Beziehung wurde für Ökoregionen gezeigt (Pausas & Ribeiro 2013). Eine 0,25°-Zelle (ca. 28 km) kann mehrere Biome, Ackerland und Wald mischen; die Kurve kann dadurch verwischt werden. (Folgerung aus dem Rastermaß, nicht an einer Quelle belegt.)"
  - "Zeitachse: 14 bis 25 Monate Verzögerung verbrauchen einen großen Teil der 156 Monate (2013-2025) und verkleinern die Kalibrier-, Validierungs- und Testzeiträume aus ARCHITECTURE.md Abschnitt 9a. Der Zeitraum der Vorjahre könnte für den Niederschlag mit IMERG-Daten vor 2013 verlängert werden, das erfordert eine Entscheidung gegen E3."
  - "Wenige unabhängige Jahre: Die Feuer-Anomalie-Reihen einer Zelle haben nur 13 Jahresgänge; Nachbarzellen sind räumlich korreliert. Der Permutationstest muss diese Nachbarschaft und die Saison erhalten (ARCHITECTURE.md Abschnitt 8, Punkt 3)."
