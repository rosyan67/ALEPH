id: nachtlicht-wirtschaft
titel: Nachtlicht folgt der Wirtschaftsleistung eines Landes (Elastizität zwischen Nachtlicht und BIP)
disziplin: Entwicklungsökonomie / Fernerkundung
# Formuliert am 2026-09-23, vor jeder Auswertung von ALEPH-Testdaten. Erwartungen hier dürfen nach dem Test nicht angepasst werden.
# Ergebnisse gehören ausschließlich nach prüfergebnisse.

