# Sondereinheiten der Länderzuordnung (Anweisung vom 2026-09-26, Punkt 7)
#
# Grundsatz: ALEPH trifft keine eigenen Souveränitätsentscheidungen. Oberste Ebene ist die UN-Sicht
# (Liste M49, aleph/layers/un_m49.py). Umstrittene Gebiete, besetzte Gebiete/Konfliktzonen und Gebiete
# mit Sonderstatus sind eigene, markierte Einheiten und gehen nie still im übergeordneten Staat auf.
#
# Jede Angabe nennt ihre Quelle (Schlüssel unter `quellen`). Zitate sind wörtlich (Englisch im Original),
# aus den am 2026-09-25 geladenen Originaldokumenten (PDF-Text mit pypdf extrahiert, bzw. HTML/CSV).
# Was nicht belegt ist, steht als „unklar“. Keine wertenden Wörter.
#
# un_art: ausdrücklich = die UN-Quelle nennt Gebiet und Staat; abgeleitet = aus einer UN-Quelle
#         geschlossen, die das Gebiet nicht einzeln nennt (Schluss steht dabei); unklar = kein UN-Beleg.
# weltbank_art: belegt | abgeleitet | unklar | keine (Weltbank führt keine Zahl für dieses Gebiet).
#         weltbank_code ist bei „unklar“ nur der Kandidat (verwaltender Staat laut Natural Earth), damit
#         eine Vergleichsrechnung möglich ist; er ist dann ausdrücklich nicht belegt.
# geometrie: aus welcher Natural-Earth-Datei (5.1.1) und welchem Eintrag der Umriss stammt.
#         laender = Admin 0 Countries (Feld ADM0_A3), umstritten = Admin 0 Disputed Areas (Feld BRK_A3),
#         provinzen = Admin 1 States/Provinces (Feld adm1_code). Nichts ist selbst gezeichnet.
# gueltig: Zeitraum. Die Umrisse sind ein fester Stand (Natural Earth 5.1.1, Dateien vom Mai 2022);
#         einen Stichtag nennt der Anbieter nicht. Zeitabhängige Umrisse sind noch nicht gebaut.

