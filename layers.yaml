    name: VNP46A3 Black Marble Nightlights
    status: fertig
    datei: aleph/layers/vnp46a3.py
    raster: 0.25°
    zeitraum: 2013-2025
    felder:
      - allangle
      - near_nadir
    erstellt: 2026-09-22

